d{display:grid;gap:6px;margin:12px 0}.field label{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--ink);font-size:12px}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid #b6e0d4;border-color:var(--green)}.preview-layout{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:18px}.phone{background:#e9efed;border:8px solid #213d45;border-radius:30px;padding:0;overflow:hidden;max-width:390px;margin:auto;box-shadow:var(--shadow)}.phonehead{background:#075e54;color:white;padding:15px;display:flex;gap:10px;align-items:center}.phonehead small{display:block;opacity:.75;font-size:10px}.chatbody{padding:16px 12px;min-height:420px;background-color:#e8e5dc;background-image:linear-gradient(#e8e5dcdd,#e8e5dcdd);display:flex;flex-direction:column;gap:10px}.bubble{max-width:88%;padding:10px 12px;border-radius:12px;background:white;font-size:12px;line-height:1.5;box-shadow:0 1px 2px #0001;white-space:pre-wrap}.bubble.out{align-self:flex-end;background:#d9fdd3}.quick{background:white;border:1px solid #dbe5e1;color:#087c68;border-radius:9px;padding:9px;font-size:11px;text-align:center;font-weight:700}.chatinput{background:white;padding:10px;display:flex;gap:8px}.chatinput input{border:0;outline:0;flex:1;min-width:0;font-size:12px}.chatinput button{border:0;border-radius:50%;width:32px;height:32px;background:var(--green);color:white}.note{background:#f5f8f9;border-radius:12px;padding:14px;font-size:12px;line-height:1.6;color:#526771}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:11px}.table th{color:var(--muted);font-weight:700}.empty{padding:35px;text-align:center;color:var(--muted);font-size:12px}.hidden{display:none!important}.toast{position:fixed;bottom:22px;right:22px;background:#173b48;color:white;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:20;font-size:12px}.mobilemenu{display:none}

.authscreen{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:#fff}.authvisual{background:linear-gradient(145deg,#10394d,#087c68);color:white;padding:clamp(28px,6vw,80px);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.authvisual:before,.authvisual:after{content:"";position:absolute;border:1px solid #ffffff22;border-radius:50%;width:440px;height:440px;right:-140px;top:12%}.authvisual:after{width:310px;height:310px;right:-75px;top:23%}.authbrand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}.authbrandmark{width:42px;height:42px;border-radius:14px;background:#ffffff20;display:grid;place-items:center;font-size:22px;font-weight:800}.authbrand strong{font-size:18px}.authcopy{position:relative;z-index:1;max-width:520px}.authcopy .eyebrow{color:#a7e5d3}.authcopy h1{font-size:clamp(30px,4vw,48px);line-height:1.08;letter-spacing:-.045em;margin:12px 0 16px}.authcopy p{color:#d1e6e2;line-height:1.7;font-size:14px}.authfoot{font-size:11px;color:#c0d9d5;position:relative;z-index:1}.authformwrap{display:flex;align-items:center;justify-content:center;padding:30px 22px}.authform{width:min(100%,390px)}.authform h2{font-size:25px;color:var(--navy);margin:0 0 8px;letter-spacing:-.03em}.authform .intro{color:var(--muted);font-size:13px;line-height:1.55;margin:0 0 24px}.authform .field{margin:15px 0}.authform .field input{padding:13px}.authform .btn{padding:12px 15px}.authsubmit{width:100%;margin-top:8px}.authswitch{font-size:12px;color:var(--muted);text-align:center;margin-top:20px}.authswitch button{border:0;background:none;color:var(--green);font-weight:800}.authmessage{font-size:12px;line-height:1.5;padding:11px 12px;border-radius:10px;background:#eef7f4;color:#087c68;margin:14px 0}.authmessage.error{background:#fff0ef;color:#a33b32}.authback{border:0;background:none;color:var(--muted);font-size:12px;padding:0;margin-bottom:22px}.authhint{font-size:11px;color:#8a999f;line-height:1.5; <body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="brandmark">O</div><div><strong>OrientaDor</strong><small>Atendimento inteligente</small></div></div>
 <div><div class="navlabel">Workspace</div><nav class="nav" id="sidenav">
 <button data-page="overview" class="active"><span class="ico">▦</span>Visão geral</button>
 <button data-page="conversations"><span class="ico">▤</span>Conversas</button>
 <button data-page="templates"><span class="ico">▧</span>Templates</button>
 <button data-page="builder"><span class="ico">⌘</span>Construtor de fluxos</button>
 <button data-page="channels"><span class="ico">◉</span>Canais</button>
 <button data-page="settings"><span class="ico">⚙</span>Configurações</button>
 </nav></div>
 <div class="sidebottom"><b>Ambiente de demonstração</b><span>Os dados desta versão ficam salvos neste navegador.</span></div>
</aside>
<main class="main">
 <header class="topbar"><div class="crumb">OrientaDor <span style="color:#b8c4c8">/</span> <b id="crumb">Visão geral</b></div><div class="topright"><span class="status">● Conta profissional</span><button class="btn" id="logoutBtn">Sair</button><div class="avatar" id="userAvatar">OD</div></div></header>
 <nav class="navdrawer" id="mobileNav">
 <button data-page="overview">Visão geral</button><button data-page="conversations">Conversas</button><button data-page="templates">Templates</button><button data-page="builder">Construtor</button><button data-page="channels">Canais</button><button data-page="settings">Configurações</button>
 </nav>
 <section class="content" id="page"></section>
</main></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);\n// Inicializa o SDK; nenhuma consulta ao banco é feita até aplicarmos o schema e as políticas RLS.\nconst odSupabase = (window.supabase && window.OD_SUPABASE_CONFIG) ? window.supabase.createClient(window.OD_SUPABASE_CONFIG.url, window.OD_SUPABASE_CONFIG.publishableKey) : null;\nwindow.odSupabase = odSupabase;
const initialNodes=[
{id:"start",type:"start",title:"Início da conversa",text:"Paciente inicia o atendimento pelo site ou WhatsApp."},
{id:"welcome",type:"message",title:"Boas-vindas",text:"Olá! Seja bem-vindo(a)! Sou a assistente virtual de {{nome_profissional}}. Como posso chamar você?"},
{id:"name",type:"question",title:"Identificação do paciente",text:"Perguntar o nome e salvar em {{nome_paciente}}."},
{id:"menu",type:"options",title:"Menu principal",text:"Agendar consulta · Conhecer profissional · Localização · Valores · Falar com atendente"},
{id:"route",type:"condition",title:"Direcionar atendimento",text:"Direciona para o fluxo conforme a opção selecionada."},
{id:"appointment",type:"action",title:"Agendamento",text:"Consultar disponibilidade e registrar solicitação na agenda."},
{id:"human",type:"handoff",title:"Atendimento humano",text:"Encaminhar conversa para a equipe responsável."},
{id:"end",type:"end",title:"Finalização",text:"Concluir atendimento e registrar o resultado."}
];
const templates=[
{id:"health",icon:"✚",name:"Atendimento inicial — Saúde",desc:"Boas-vindas, identificação, menu principal e direcionamento para os principais serviços.",nodes:initialNodes},
{id:"schedule",icon:"▦",name:"Agendamento de consultas",desc:"Coleta de preferência, consulta de horários, dados cadastrais e confirmação.",nodes:[initialNodes[0],{id:"welcome",type:"message",title:"Boas-vindas",text:"Vamos encontrar um horário para você."},{id:"kind",type:"options",title:"Tipo de atendimento",text:"Primeira consulta · Retorno · Acompanhamento"},{id:"period",type:"options",title:"Preferência de horário",text:"Manhã · Tarde · Noite · Flexível"},{id:"calendar",type:"action",title:"Consultar agenda",text:"Consultar disponibilidade real do profissional."},{id:"confirm",type:"question",title:"Confirmar agendamento",text:"Solicitar confirmação do horário selecionado."},initialNodes[7]]},
{id:"faq",icon:"☷",name:"Dúvidas frequentes",desc:"Respostas administrativas sobre serviços, preparo, endereço e formas de pagamento.",nodes:[initialNodes[0],{id:"welcome",type:"message",title:"Apresentação",text:"Olá! Posso ajudar com informações sobre o atendimento."},{id:"faqmenu",type:"options",title:"Escolha uma dúvida",text:"Serviços · Endereço · Pagamento · Preparação para consulta"},{id:"answer",type:"message",title:"Resposta cadastrada",text:"Apresentar conteúdo informativo configurado pelo profissional."},initialNodes[7]]}
];
let state={page:"overview",nodes:JSON.parse(localStorage.getItem("od_nodes")||"null")||structuredClone(initialNodes),selected:"welcome",flowName:localStorage.getItem("od_flowName")||"Atendimento inicial — Saúde",conversations:JSON.parse(localStorage.getItem("od_conversations")||"[]"),channel:JSON.parse(localStorage.getItem("od_channel")||"{}")};
const labels={overview:"Visão geral",conversations:"Conversas",templates:"Templates",builder:"Construtor de fluxos",channels:"Canais",settings:"Configurações"};
const types={start:["▶","Início"],message:["▤","Mensagem"],question:["?","Pergunta"],options:["☷","Opções"],condition:["◇","Condição"],action:["⚡","Ação / integração"],handoff:["♧","Atendimento humano"],end:["✓","Finalização"]};
function save(){localStorage.setItem("od_nodes",JSON.stringify(state.nodes));localStorage.setItem("od_flowName",state.flowName);localStorage.setItem("od_conversations",JSON.stringify(state.conversations));localStorage.setItem("od_channel",JSON.stringify(state.channel))}
function toast(t){let el=$("#toast");el.textContent=t;el.classList.remove("hidden");setTimeout(()=>el.classList.add("hidden"),2600)}
function go(p){state.page=p;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));$("#crumb").textContent=labels[p];render()}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
function heading(k,t,d,action=""){return '<div class="heading"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p>'+d+'</p></div>'+action+'</div>'}
function render(){let p=$("#page");if(state.page==="overview")p.innerHTML=overview();if(state.page==="templates")p.innerHTML=templatesPage();if(state.page==="builder")p.innerHTML=builderPage();if(state.page==="conversations")p.innerHTML=conversationsPage();if(state.page==="channels")p.innerHTML=channelsPage();if(state.page==="settings")p.innerHTML=settingsPage();bindPage()}
function overview(){return heading("CENTRAL DE ATENDIMENTO","Atendimento inteligente","Acompanhe as conversas e gerencie os fluxos de atendimento dos seus pacientes.",'<button class="btn primary" data-go="builder">＋ Criar fluxo</button>')+
'<div class="cards"><div class="card metric"><span class="label">Conversas iniciadas</span><strong>'+state.conversations.length+'</strong><small>Desde o início da demonstração</small></div><div class="card metric"><span class="label">Fluxos configurados</span><strong>1</strong><small>Template em edição</small></div><div class="card metric"><span class="label">Canais conectados</span><strong>0</strong><small>Configure um canal para ativar</small></div><div class="card metric"><span class="label">Agendamentos</span><strong>0</strong><small>Integração futura com agenda</small></div></div>'+
'<div class="two"><div class="panel"><h3>Seu fluxo principal</h3><p class="sub">Modelo selecionado para o atendimento do paciente.</p><div class="listrow"><div><b>'+esc(state.flowName)+'</b><small>'+state.nodes.length+' blocos · Última edição neste navegador</small></div><span class="pill">Rascunho</span></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn primary" data-go="builder">Editar fluxo</button><button class="btn" data-go="templates">Ver templates</button></div></div><div class="panel"><h3>Próximos passos</h3><p class="sub">Para colocar o atendimento em produção.</p><div class="list"><div class="listrow"><div><b>1. Personalizar o fluxo</b><small>Revise mensagens e opções.</small></div><span class="pill">Pendente</span></div><div class="listrow"><div><b>2. Conectar um canal</b><small>WhatsApp ou chat do site.</small></div><span class="pill gray">Pendente</span></div><div class="listrow"><div><b>3. Configurar integrações</b><small>Agenda e cadastro de pacientes.</small></div><span class="pill gray">Futuro</span></div></div></div></div>'}
function templatesPage(){return heading("BIBLIOTECA","Templates de atendimento","Comece com um modelo pronto e personalize as mensagens, perguntas e caminhos para a realidade do profissional.")+
'<div class="template-grid">'+templates.map(t=>'<article class="template"><div class="tile">'+t.icon+'</div><h3>'+t.name+'</h3><p>'+t.desc+'</p><footer><span class="pill">Template</span><button class="btn soft" data-template="'+t.id+'">Usar template →</button></footer></article>').join("")+'</div><div class="note" style="margin-top:18px">Ao selecionar um template, ele será carregado no construtor como rascunho. Nesta primeira versão, a biblioteca é demonstrativa e as alterações ficam salvas localmente no navegador.</div>'}
function builderPage(){let n=state.nodes.find(x=>x.id===state.selected)||state.nodes[0];return heading("AUTOMAÇÃO","Construtor de fluxos","Monte a jornada do paciente com blocos conectáveis. Selecione um bloco para editar suas propriedades.",'<button class="btn" data-go="templates">Biblioteca</button>')+
'<div class="builder"><aside class="toolbox"><h3>Adicionar bloco</h3>'+Object.keys(types).filter(t=>t!=="start").map(t=>'<button class="blocktool" data-add="'+t+'"><span>'+types[t][0]+'</span>'+types[t][1]+'</button>').join("")+'</aside><section class="canvas"><div class="canvashead"><b>'+esc(state.flowName)+'</b><button class="btn primary" id="saveFlow">Salvar rascunho</button></div><div class="nodes">'+state.nodes.map((x,i)=>'<div class="node '+(x.id===state.selected?'selected':'')+'" data-node="'+x.id+'"><div class="ntop"><span class="nicon">'+types[x.type][0]+'</span>'+types[x.type][1]+' <span style="color:#9aa8ad;font-weight:500">· '+esc(x.title)+'</span></div><p>'+esc(x.text)+'</p></div>'+(i<state.nodes.length-1?'<div class="connector"></div>':'')).join("")+'</div></section><aside class="properties"><h3>Propriedades do bloco</h3>'+ (n?'<div class="field"><label>Tipo de bloco</label><input value="'+types[n.type][1]+'" disabled></div><div class="field"><label>Nome interno</label><input id="nodeTitle" value="'+attr(n.title)+'"></div><div class="field"><label>Mensagem / descrição</label><textarea id="nodeText">'+esc(n.text)+'</textarea></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn primary" id="applyNode">Aplicar</button><button class="btn" id="deleteNode" '+(n.type==="start"?'disabled':'')+'>Excluir</button></div>':'Selecione um bloco')+'<div class="note" style="margin-top:16px">Nesta versão, os blocos são organizados em sequência para validar a experiência. Ramificações condicionais, conexões livres e execução real serão implementadas nas próximas etapas.</div></aside></div>'}
function conversationsPage(){return heading("ATENDIMENTO","Conversas","Visualize as conversas iniciadas pelo simulador. A integração com canais reais será ativada posteriormente.")+(state.conversations.length?'<div class="panel"><table class="table"><thead><tr><th>Paciente</th><th>Canal</th><th>Última interação</th><th>Status</th></tr></thead><tbody>'+state.conversations.map(c=>'<tr><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.channel)+'</td><td>'+esc(c.date)+'</td><td><span class="pill">'+esc(c.status)+'</span></td></tr>').join("")+'</tbody></table></div>':'<div class="panel empty">Ainda não há conversas registradas.<br><button class="btn primary" style="margin-top:14px" data-go="builder">Testar um fluxo</button></div>')}
function channelsPage(){return heading("CONECTIVIDADE","Canais de atendimento","Conecte o WhatsApp do profissional ou utilize um número central da plataforma. Também será possível incorporar o chat ao site.")+
'<div class="two"><div class="panel"><h3>WhatsApp Business Platform</h3><p class="sub">Conexão oficial por meio da API da Meta.</p><div class="list"><div class="listrow"><div><b>Número próprio do profissional</b><small>Cada profissional conecta e administra seu número.</small></div><span class="pill amber">Não conectado</span></div><div class="listrow"><div><b>Número central da plataforma</b><small>Distribuição das conversas por profissional.</small></div><span class="pill amber">Não conectado</span></div></div><button class="btn primary" style="margin-top:15px" id="whatsInfo">Configurar WhatsApp</button></div><div class="panel"><h3>Chat do site</h3><p class="sub">Widget incorporado no site do profissional.</p><div class="listrow"><div><b>Widget web</b><small>Chat responsivo para desktop e celular.</small></div><span class="pill amber">Não publicado</span></div><button class="btn" style="margin-top:15px" id="webInfo">Ver instruções de publicação</button></div></div><div class="note" style="margin-top:16px">A conexão real exige credenciais da Meta, número habilitado, webhook HTTPS, backend seguro e configuração de modelos de mensagem. Não insira tokens ou senhas nesta tela demonstrativa.</div>'}
function settingsPage(){return heading("CONFIGURAÇÕES","Preferências do atendimento","Personalize os dados utilizados nos templates e no atendimento automatizado.")+
'<div class="two"><div class="panel"><h3>Dados do profissional</h3><p class="sub">Informações utilizadas nas mensagens dinâmicas.</p><div class="field"><label>Nome do profissional</label><input id="proName" placeholder="Ex.: Dra. Ana Souza" value="'+attr(localStorage.getItem("od_proName")||"")+'"></div><div class="field"><label>Especialidade</label><input id="proSpecialty" placeholder="Ex.: Fisioterapia" value="'+attr(localStorage.getItem("od_proSpecialty")||"")+'"></div><div class="field"><label>Endereço / localização</label><input id="proAddress" placeholder="Endereço do consultório" value="'+attr(localStorage.getItem("od_proAddress")||"")+'"></div><button class="btn primary" id="saveSettings">Salvar configurações</button></div><div class="panel"><h3>Regras gerais</h3><div class="field"><label>Tempo de inatividade (minutos)</label><input type="number" min="1" value="15"></div><div class="field"><label>Mensagem de transferência</label><textarea>Vou encaminhar você para nossa equipe de atendimento.</textarea></div><div class="note">Configurações de produção, consentimentos, retenção de dados e políticas de privacidade deverão ser persistidos no Supabase com controle de acesso por profissional.</div></div></div>'}
function bindPage(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll("[data-template]").forEach(b=>b.onclick=()=>{let t=templates.find(x=>x.id===b.dataset.template);state.nodes=structuredClone(t.nodes);state.flowName=t.name;state.selected=state.nodes[1]?.id||state.nodes[0].id;save();go("builder");toast("Template carregado no construtor")});document.querySelectorAll("[data-node]").forEach(b=>b.onclick=()=>{state.selected=b.dataset.node;render()});document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{let type=b.dataset.add;let id=type+"_"+Date.now();state.nodes.push({id,type,title:types[type][1],text:"Configure o conteúdo deste bloco."});state.selected=id;save();render()});if($("#applyNode"))$("#applyNode").onclick=()=>{let n=state.nodes.find(x=>x.id===state.selected);n.title=$("#nodeTitle").value;n.text=$("#nodeText").value;save();render();toast("Bloco atualizado")};if($("#deleteNode"))$("#deleteNode").onclick=()=>{state.nodes=state.nodes.filter(x=>x.id!==state.selected);state.selected=state.nodes[0]?.id;save();render();toast("Bloco removido")};if($("#saveFlow"))$("#saveFlow").onclick=()=>{save();toast("Rascunho salvo neste navegador")};if($("#saveSettings"))$("#saveSettings").onclick=()=>{["proName","proSpecialty","proAddress"].forEach(id=>localStorage.setItem("od_"+id,$("#"+id).value));toast("Configurações salvas")};if($("#whatsInfo"))$("#whatsInfo").onclick=()=>toast("A integração será configurada após provisionar o backend e as credenciais da Meta.");if($("#webInfo"))$("#webInfo").onclick=()=>toast("O widget web será disponibilizado após a implementação do endpoint público.");}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s).replace(/\n/g," ")}
render();
</script></body></html>
