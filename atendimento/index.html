p:4px;padding:4px;border:1px solid var(--line);border-radius:11px;background:#f4f8fb}.agenda-view-switch .btn{border:0;background:transparent;padding:7px 12px}.agenda-view-switch .btn.active{background:#01355E;color:#fff;box-shadow:0 2px 6px #01355e22}.agenda-week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin:12px 0 18px}.agenda-month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:12px 0 18px}.agenda-day-cell{min-height:88px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px;cursor:pointer;text-align:left;color:var(--text)}.agenda-day-cell:hover{border-color:#8bb2d0;background:#f5f9fd}.agenda-day-cell.selected{border:2px solid #397eaa;background:#edf5fc}.agenda-day-cell.today .agenda-day-number{color:#1479b8;font-weight:850}.agenda-day-head{font-size:10px;color:var(--muted);font-weight:750;text-transform:uppercase}.agenda-day-number{font-size:14px;font-weight:750;margin:5px 0}.agenda-day-count{font-size:10px;color:#28648c}.agenda-month-grid .agenda-day-cell{min-height:72px}.agenda-day-cell.outside{opacity:.4}.agenda-calendar-empty{padding:12px;color:var(--muted);font-size:12px}@media(max-width:700px){.agenda-week-grid{gap:3px}.agenda-day-cell{min-height:70px;padding:5px}.agenda-day-head{font-size:8px}.agenda-day-number{font-size:12px}.agenda-day-count{font-size:9px}.agenda-month-grid{gap:3px}.agenda-month-grid .agenda-day-cell{min-height:58px}}.dash-welcome{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:28px 30px;margin-bottom:20px;border-radius:20px;background:linear-gradient(115deg,#01355E,#0b527f);color:#fff;box-shadow:0 14px 35px #01355e20}.dash-kicker{display:block;font-size:10px;font-weight:800;letter-spacing:.12em;color:#6e9bc0}.dash-welcome .dash-kicker{color:#b7d5ec}.dash-welcome h1{font-size:26px;letter-spacing:-.04em;margin:8px 0}.dash-welcome p{margin:0;color:#d8e8f4;font-size:13px}.dash-welcome .btn{background:#fff;color:#01355E;bord 0px;border-radius:13px;background:#fff;color:#1769a5;display:grid;place-items:center;font-size:20px}.dash-panel-note h3{margin:2px 0 7px;color:#01355E;font-size:15px}.dash-panel-note p{margin:0 0 10px;color:#536f83;font-size:12px;line-height:1.55}@media(max-width:1050px){.dash-shortcuts{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.dash-welcome{padding:22px;align-items:flex-start;flex-direction:column}.dash-welcome h1{font-size:22px}.dash-metrics{grid-template-columns:1fr}.dash-shortcuts{grid-template-columns:1fr 1fr}.dash-bottom{grid-template-columns:1fr}}@media(max-width:420px){.dash-shortcuts{grid-template-columns:1fr}}</style></head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="brandmark">O</div><div><strong>OrientaDor</strong><small>Atendimento inteligente</small></div></div>
 <div><div class="navlabel">Workspace</div><nav class="nav" id="sidenav">
 <button data-page="overview" class="active"><span class="ico">▦</span>Visão geral</button>
 <button data-page="conversations"><span class="ico">▤</span>Conversas</button>
 <button data-page="agenda"><span class="ico">▦</span>Agenda</button>
 <button data-page="templates"><span class="ico">▧</span>Templates</button>
 <button data-page="builder"><span class="ico">⌘</span>Construtor de fluxos</button>
 <button data-page="channels"><span class="ico">◉</span>Canais</button>
 <button data-page="profile"><span class="ico">♙</span>Meu perfil</button>
 <button data-page="settings"><span class="ico">⚙</span>Configurações</button>
 </nav></div>
 <div class="sidebottom"><b>Ambiente de desenvolvimento</b><span>Perfil e fluxos são sincronizados com sua conta. Canais e conversas ainda estão em desenvolvimento.</span></div>
</aside>
<main class="main">
 <header class="topbar"><div class="crumb">OrientaDor <span style="color:#b8c4c8">/</span> <b id="crumb">Visão geral</b></div><div class="topright"><span class="status">● Conta profissional</span><button class="notification-bell" id="notificationBell" type="button" aria-label="Notificações" title="Ver conversas com mensagens novas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span class="notification-bell-dot" id="notificationBellDot" hidden></span></button><button class="btn" id="logoutBtn">Sair</button><div class="avatar" id="userAvatar">OD</div></div></header>
 <nav class="navdrawer" id="mobileNav">
 <button data-page="overview">Visão geral</button><button data-page="conversations">Conversas</button><button data-page="agenda">Agenda</button><button data-page="templates">Templates</button><button data-page="builder">Construtor</button><button data-page="channels">Canais</button><button data-page="profile">Meu perfil</button><button data-page="settings">Configurações</button>
 </nav>
 <section class="content" id="page"></section>
</main></div><div id="authRoot"></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);
// Inicializa o SDK; nenhuma consulta ao banco é feita até aplicarmos o schema e as políticas RLS.
const odSupabase = (window.supabase && window.OD_SUPABASE_CONFIG) ? window.supabase.createClient(window.OD_SUPABASE_CONFIG.url, window.OD_SUPABASE_CONFIG.publishableKey) : null;
window.odSupabase = odSupabase;
const initialNodes=[
{id:"start",type:"start",title:"Início da conversa",text:"Paciente inicia o atendimento pelo site ou WhatsApp."},
{id:"welcome",type:"message",title:"Boas-vindas",text:"Olá! Seja bem-vindo(a)! Sou a assistente virtual de {{nome_profissional}}. Como posso chamar você?"},
{id:"name",type:"question",title:"Identificação do paciente",text:"Perguntar o nome e salvar em {{nome_paciente}}."},
{id:"menu",type:"options",title:"Menu principal",text:"Agendar consulta · Conhecer profissional · Localização · Valores · Falar com atendente"},
{id:"route",type:"condition",title:"Direcionar atendimento",text:"Direciona para o fluxo conforme a opção selecionada."},
{id:"appointment",type:"action",title:"Agendamento",text:"Consultar disponibilidade e registrar solicitação na agenda."},
{id:"human",type:"handoff",title:"Atendimento humano",text:"Encaminhar conversa para a equipe responsável."},
{id:"end",type:"end",title:"Finalização",text:"Concluir atendimento e registrar o resultado."}
];
const templates=[
{id:"health",icon:"✚",name:"Atendimento inicial — Saúde",desc:"Boas-vindas, identificação, menu principal e direcionamento para os principais serviços.",nodes:initialNodes},
{id:"schedule",icon:"▦",name:"Agendamento de consultas",desc:"Coleta de preferência, consulta de horários, dados cadastrais e confirmação.",nodes:[initialNodes[0],{id:"welcome",type:"message",title:"Boas-vindas",text:"Vamos encontrar um horário para você."},{id:"kind",type:"options",title:"Tipo de atendimento",text:"Primeira consulta · Retorno · Acompanhamento"},{id:"period",type:"options",title:"Preferência de horário",text:"Manhã · Tarde · Noite · Flexível"},{id:"calendar",type:"action",title:"Consultar agenda",text:"Consultar disponibilidade real do profissional."},{id:"confirm",type:"question",title:"Confirmar agendamento",text:"Solicitar confirmação do horário selecionado."},initialNodes[7]]},
{id:"faq",icon:"☷",name:"Dúvidas frequentes",desc:"Respostas administrativas sobre serviços, preparo, endereço e formas de pagamento.",nodes:[initialNodes[0],{id:"welcome",type:"message",title:"Apresentação",text:"Olá! Posso ajudar com informações sobre o atendimento."},{id:"faqmenu",type:"options",title:"Escolha uma dúvida",text:"Serviços · Endereço · Pagamento · Preparação para consulta"},{id:"answer",type:"message",title:"Resposta cadastrada",text:"Apresentar conteúdo informativo configurado pelo profissional."},initialNodes[7]]}
];
let state={page:"overview",nodes:JSON.parse(localStorage.getItem("od_nodes")||"null")||structuredClone(initialNodes),selected:"welcome",flowName:localStorage.getItem("od_flowName")||"Atendimento inicial — Saúde",flowId:null,chatbotId:null,flowDirty:false,flowLoading:false,edges:[],previewTemplateId:null,conversations:JSON.parse(localStorage.getItem("od_conversations")||"[]"),channel:JSON.parse(localStorage.getItem("od_channel")||"{}")};
const labels={overview:"Visão geral",conversations:"Conversas",agenda:"Agenda",templates:"Templates",builder:"Construtor de fluxos",channels:"Canais",profile:"Meu perfil",settings:"Configurações"};
const types={start:["▶","Início"],message:["▤","Mensagem"],question:["?","Pergunta"],options:["☷","Opções"],condition:["◇","Condição"],action:["⚡","Ação / integração"],appointment:["▦","Agendar consulta"],handoff:["♧","Atendimento humano"],end:["✓","Finalização"]};
function save(){localStorage.setItem("od_nodes",JSON.stringify(state.nodes));localStorage.setItem("od_flowName",state.flowName);localStorage.setItem("od_conversations",JSON.stringify(state.conversations));localStorage.setItem("od_channel",JSON.stringify(state.channel))}
function toast(t){let el=$("#toast");el.textContent=t;el.classList.remove("hidden");setTimeout(()=>el.classList.add("hidden"),2600)}
function go(p){state.page=p;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));$("#crumb").textContent=labels[p];render();if(p==="profile")loadProfessionalProfile();if((p==="builder"||p==="channels")&&!state.flowDirty&&!state.chatbotId)loadBuilderFromSupabase();if(p==="conversations")loadConversations();if(p==="agenda")loadAppointments()}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
function heading(k,t,d,action=""){return '<div class="heading"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p>'+d+'</p></div>'+action+'</div>'}
function render(){let p=$("#page");if(state.page==="overview")p.innerHTML=overview();if(state.page==="templates")p.innerHTML=templatesPage();if(state.page==="builder")p.innerHTML=builderPage();if(state.page==="conversations")p.innerHTML=conversationsPage();if(state.page==="agenda")p.innerHTML=agendaPage();if(state.page==="channels")p.innerHTML=channelsPage();if(state.page==="profile")p.innerHTML=profilePage();if(state.page==="settings")p.innerHTML=settingsPage();bindPage()}
function overview(){
 const firstName=(currentUser?.user_metadata?.full_name||currentUser?.email||"profissional").split(/[ @]/)[0];
 return '<section class="dash-welcome"><div><span class="dash-kicker">ESPAÇO DO PROFISSIONAL</span><h1>Olá, '+esc(firstName)+'! 👋</h1><p>Seu atendimento, sua agenda e suas automações em um só lugar.</p></div><button class="btn primary" data-go="builder">＋ Criar fluxo</button></section>'+
 '<section class="dash-metrics"><article class="dash-metric"><span class="dash-metric-icon">☷</span><div><small>Conversas carregadas</small><strong>'+state.conversations.length+'</strong><span>Na central de atendimento</span></div></article><article class="dash-metric"><span class="dash-metric-icon">⌘</span><div><small>Blocos no fluxo atual</small><strong>'+state.nodes.length+'</strong><span>'+esc(state.flowName||"Fluxo principal")+'</span></div></article><article class="dash-metric"><span class="dash-metric-icon">▦</span><div><small>Agenda profissional</small><strong>Agenda</strong><span>Consulte e gerencie horários</span></div><button class="dash-link" data-go="agenda">Abrir →</button></article></section>'+
 '<section class="dash-section"><div class="dash-section-head"><div><span class="dash-kicker">ACESSO RÁPIDO</span><h2>O que você deseja fazer?</h2><p>Atalhos para as principais áreas da plataforma.</p></div></div><div class="dash-shortcuts"><button class="dash-shortcut" data-go="conversations"><span class="dash-shortcut-icon">☷</span><b>Conversas</b><small>Acompanhe mensagens e atendimentos</small><span class="dash-arrow">Abrir conversas →</span></button><button class="dash-shortcut" data-go="agenda"><span class="dash-shortcut-icon">▦</span><b>Agenda</b><small>Gerencie consultas e disponibilidade</small><span class="dash-arrow">Abrir agenda →</span></button><button class="dash-shortcut" data-go="builder"><span class="dash-shortcut-icon">⌘</span><b>Construtor de fluxos</b><small>Configure a jornada automatizada</small><span class="dash-arrow">Editar fluxo →</span></button><button class="dash-shortcut" data-go="templates"><span class="dash-shortcut-icon">▧</span><b>Templates</b><small>Comece com modelos prontos</small><span class="dash-arrow">Ver modelos →</span></button></div></section>'+
 '<section class="dash-bottom"><article class="panel dash-flow-panel"><div class="dash-panel-head"><div><span class="dash-kicker">AUTOMAÇÃO</span><h2>Seu fluxo atual</h2></div><span class="pill">Em edição</span></div><h3>'+esc(state.flowName||"Fluxo principal")+'</h3><p class="sub">'+state.nodes.length+' blocos configurados no construtor.</p><button class="btn primary" data-go="builder">Continuar editando</button></article><article class="dash-panel-note"><span class="dash-note-icon">✦</span><div><h3>Uma experiência de cuidado mais simples</h3><p>Organize seus atendimentos, facilite o agendamento e acompanhe as conversas com seus pacientes.</p><button class="dash-link" data-go="profile">Completar meu perfil →</button></div></article></section>';
}
function templatesPage(){
 const selected=templates.find(t=>t.id===state.previewTemplateId);
 return heading("BIBLIOTECA","Templates de atendimento","Escolha um modelo, confira as mensagens e personalize o fluxo para a rotina do profissional.")+
 '<div class="template-grid">'+templates.map(t=>'<article class="template"><div class="tile">'+t.icon+'</div><h3>'+esc(t.name)+'</h3><p>'+esc(t.desc)+'</p><div class="template-actions"><button class="btn" data-preview-template="'+t.id+'">Visualizar</button><button class="btn soft" data-template="'+t.id+'">Usar modelo →</button></div></article>').join("")+'</div>'+
 '<div class="note" style="margin-top:18px">Os modelos são uma base inicial. Ao usar um deles, você cria uma cópia editável no seu construtor; o modelo original permanece disponível para outros usos.</div>'+
 (selected?'<div class="template-preview" id="templatePreview"><section class="template-dialog" role="dialog" aria-modal="true" aria-label="Prévia do template"><div class="template-dialog-head"><div><div class="eyebrow">PRÉVIA DO MODELO</div><h2>'+esc(selected.name)+'</h2><p class="sub">'+esc(selected.desc)+'</p></div><button class="btn" data-close-preview>Fechar</button></div><div class="template-preview-list">'+selected.nodes.map((n,i)=>'<article class="template-preview-node"><div class="tile">'+(types[n.type]?.[0]||"•")+'</div><div><b>'+(i+1)+'. '+esc(n.title)+'</b><p>'+esc(n.text)+'</p></div></article>').join("")+'</div><div class="template-dialog-actions"><button class="btn" data-close-preview>Voltar à biblioteca</button><button class="btn primary" data-template="'+selected.id+'">Usar e personalizar este modelo</button></div></section></div>':'');
}function conditionDefaults(node){
 if(!node||node.type!=="condition")return;
 state.edges=state.edges||[];
 let routes=state.edges.filter(e=>e.source===node.id);
 const yesTarget=state.nodes.find(x=>x.type==="action"&&x.id!==node.id)||state.nodes.find(x=>x.type==="message"&&x.id!==node.id)||state.nodes.find(x=>x.id!==node.id);
 let noTarget=state.nodes.find(x=>x.type==="question"&&x.id!==node.id&&x.id!==yesTarget?.id)||state.nodes.find(x=>x.type==="message"&&x.id!==node.id&&x.id!==yesTarget?.id)||state.nodes.find(x=>x.id!==node.id&&x.id!==yesTarget?.id);
 if(!routes[0]&&yesTarget){state.edges.push({source:node.id,target:yesTarget.id,label:"Sim"});}
 if(!routes[1]&&noTarget){state.edges.push({source:node.id,target:noTarget.id,label:"Não"});}
 routes=state.edges.filter(e=>e.source===node.id);
 if(routes[0]){routes[0].label="Sim";if(!state.nodes.some(x=>x.id===routes[0].target)&&yesTarget)routes[0].target=yesTarget.id;}
 if(routes[1]){routes[1].label="Não";if(!state.nodes.some(x=>x.id===routes[1].target)&&noTarget)routes[1].target=noTarget.id;}
 if(routes.length>2)state.edges=state.edges.filter(e=>e.source!==node.id||routes.indexOf(e)<2);
}

function builderPage(){
 let n=state.nodes.find(x=>x.id===state.selected)||state.nodes[0];
 conditionDefaults(n);
 const routes=(state.edges||[]).filter(e=>e.source===n?.id);

async function publishFlow(){
 const button=$("#publishFlow");if(button){button.disabled=true;button.textContent="Validando...";}
 try{
  if(!currentUser||!odSupabase)throw new Error("Faça login para publicar.");
  const name=$("#flowNameInput")?.value.trim()||state.flowName;
  if(!name)throw new Error("Informe um nome para o fluxo.");
  if(!state.nodes.length)throw new Error("Adicione blocos antes de publicar.");
  const ids=new Set(state.nodes.map(n=>n.id));
  const invalid=(state.edges||[]).find(e=>!ids.has(e.source)||!ids.has(e.target)||e.source===e.target||!String(e.label||"").trim());
  if(invalid)throw new Error("Há uma conexão inválida ou sem nome. Revise os caminhos.");
  for(const node of state.nodes.filter(n=>n.type==="options")){const outgoing=(state.edges||[]).filter(e=>e.source===node.id);if(!outgoing.length)throw new Error("O bloco de opções "+node.title+" precisa ter pelo menos um caminho configurado.");if(outgoing.some(e=>!String(e.label||"").trim()))throw new Error("Todas as opções precisam ter um texto.");}
  for(const node of state.nodes.filter(n=>n.type==="condition")){
   const outgoing=(state.edges||[]).filter(e=>e.source===node.id);
   const yes=outgoing.some(e=>/^(sim|true|yes|verdadeiro)$/i.test(String(e.label||"").trim()));
   const no=outgoing.some(e=>/^(não|nao|false|no|falso)$/i.test(String(e.label||"").trim()));
   if(!node.condition?.variable||!yes||!no)throw new Error("A condição "+node.title+" precisa de uma variável e saídas Sim e Não.");
  }
  if(!state.nodes.some(n=>n.type==="start"))throw new Error("O fluxo precisa ter um bloco de início.");
  await persistFlow();
  const latest=await odSupabase.from("chatbot_flows").select("version").eq("chatbot_id",state.chatbotId).order("version",{ascending:false}).limit(1).maybeSingle();
  if(latest.error)throw latest.error;
  const version=(latest.data?.version||0)+1;
  const definition={nodes:structuredClone(state.nodes),edges:structuredClone(state.edges||[]),settings:{version:2,published_from:state.flowId}};
  const published=await odSupabase.from("chatbot_flows").insert({chatbot_id:state.chatbotId,name,definition,status:"published",version,published_at:new Date().toISOString()}).select("id").single();
  if(published.error)throw published.error;
  const botUpdate=await odSupabase.from("chatbots").update({name,status:"published",updated_at:new Date().toISOString()}).eq("id",state.chatbotId);
  if(botUpdate.error)throw botUpdate.error;
  toast("Versão "+version+" publicada! Seu rascunho continua disponível para edição.");
 }catch(err){toast("Não foi possível publicar: "+(err.message||"erro inesperado"));}
 finally{if(button){button.disabled=false;button.textContent="Publicar fluxo";}}
}

async function saveTestMessage(direction,content,node,variables){

 if(result.error){console.error("Falha ao salvar mensagem de teste",result.error);return}
 const patch={last_message_at:new Date().toISOString(),current_node_id:node?.id||null,variables:variables||{}};
 if(variables?.nome_paciente)patch.patient_name=String(variables.nome_paciente);
 if(node?.type==="handoff")patch.status="waiting_human";
 if(node?.type==="end"){patch.status="closed";patch.closed_at=new Date().toISOString();}
 const updated=await odSupabase.from("chatbot_conversations").update(patch).eq("id",state.testConversationId);
 if(updated.error)console.error("Falha ao atualizar conversa de teste",updated.error);
}

async function loadConversations(){
 if(!currentUser||!odSupabase||conversationsLoading)return;
 conversationsLoading=true;
 const preservedFilters={search:$("#conversationSearch")?.value||"",status:$("#conversationStatusFilter")?.value||"",channel:$("#conversationChannelFilter")?.value||""};
 const result=await odSupabase.from("chatbot_conversations").select("id,patient_name,channel,status,is_test,last_message_at,started_at,flow_id,assigned_to,assigned_at,handoff_channel").eq("professional_id",currentUser.id).order("last_message_at",{ascending:false}).limit(100);
 if(result.error){conversationsLoading=false;toast("Não foi possível carregar conversas: "+result.error.message);return}
 state.conversations=result.data||[];
 const liveIds=state.conversations.filter(c=>!c.is_test&&c.status!=="closed").map(c=>c.id);
 if(liveIds.length){
  const msgResult=await odSupabase.from("chatbot_messages").select("conversation_id,sender_type,direction,created_at").in("conversation_id",liveIds).order("created_at",{ascending:true});
  if(msgResult.error){console.warn("Não foi possível calcular mensagens pendentes:",msgResult.error.message);}
  else{
   const latestByConversation={};
   (msgResult.data||[]).forEach(m=>{latestByConversation[m.conversation_id]=m});
   state.conversations=state.conversations.map(c=>{
    const latest=latestByConversation[c.id];
    const unread=latest&&(latest.sender_type==="patient"||latest.direction==="inbound")?1:0;
    return {...c,unread_count:unread};
   });
  }
 }
 render();

}

 document.body.appendChild(modal);

function bindPage(){if($("#profileAvatarFile"))$("#profileAvatarFile").onchange=uploadProfessionalAvatar;document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll("[data-preview-template]").forEach(b=>b.onclick=()=>{state.previewTemplateId=b.dataset.previewTemplate;render()});document.querySelectorAll("[data-close-preview]").forEach(b=>b.onclick=()=>{state.previewTemplateId=null;render()});document.querySelectorAll("[data-template]").forEach(b=>b.onclick=()=>{let t=templates.find(x=>x.id===b.dataset.template);if(!t)return;state.nodes=structuredClone(t.nodes).map((n,i)=>({...n,id:n.id+"_"+Date.now()+"_"+i}));state.edges=[];state.flowName=t.name;state.selected=state.nodes[1]?.id||state.nodes[0].id;state.previewTemplateId=null;state.flowDirty=true;save();go("builder");toast("Modelo carregado. Personalize e salve no Supabase.")});document.querySelectorAll("[data-node]").forEach(b=>b.onclick=()=>{state.selected=b.dataset.node;render()});document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{let type=b.dataset.add;let id=type+"_"+Date.now();state.nodes.push({id,type,title:types[type][1],text:"Configure o conteúdo deste bloco."});if(type==="appointment"){state.nodes[state.nodes.length-1].text="Agendamento automático: paciente escolhe tipo de consulta, data, horário disponível e confirma seus dados.";}if(type==="condition"){const yes=state.nodes.find(x=>x.type==="action"&&x.id!==id)||state.nodes.find(x=>x.type==="message"&&x.id!==id);const no=state.nodes.find(x=>x.type==="question"&&x.id!==id)||state.nodes.find(x=>x.type==="message"&&x.id!==id&&x.id!==yes?.id);state.edges=state.edges||[];if(yes)state.edges.push({source:id,target:yes.id,label:"Sim"});if(no)state.edges.push({source:id,target:no.id,label:"Não"});}state.selected=id;state.flowDirty=true;save();render()});document.querySelectorAll("[data-route-label]").forEach(el=>el.oninput=()=>{const e=(state.edges||[]).filter(x=>x.source===state.selected)[Number(el.dataset.routeLabel)];if(e){e.label=el.value;state.flowDirty=true}});document.querySelectorAll("[data-route-target]").forEach(el=>el.onchange=()=>{const e=(state.edges||[]).filter(x=>x.source===state.selected)[Number(el.dataset.routeTarget)];if(e){e.target=el.value;state.flowDirty=true;render()}});document.querySelectorAll("[data-remove-route]").forEach(el=>el.onclick=()=>{const list=(state.edges||[]).filter(x=>x.source===state.selected);const remove=list[Number(el.dataset.removeRoute)];state.edges=state.edges.filter(x=>x!==remove);state.flowDirty=true;render()});if($("#addRoute"))$("#addRoute").onclick=()=>{const source=state.nodes.find(x=>x.id===state.selected);const target=state.nodes.find(x=>x.id!==source.id);if(!target){toast("Adicione outro bloco antes de criar um caminho.");return}state.edges=state.edges||[];state.edges.push({source:source.id,target:target.id,label:"Nova opção"});state.flowDirty=true;render()};if($("#applyNode"))$("#applyNode").onclick=()=>{let n=state.nodes.find(x=>x.id===state.selected);n.title=$("#nodeTitle").value;n.text=$("#nodeText").value;if(n.type==="condition"){n.condition={variable:$("#conditionVariable")?.value.trim()||"resposta",operator:$("#conditionOperator")?.value||"equals",value:$("#conditionValue")?.value.trim()||""};}state.flowDirty=true;save();render();toast("Bloco atualizado. Salve o fluxo para sincronizar.")};if($("#deleteNode"))$("#deleteNode").onclick=()=>{state.nodes=state.nodes.filter(x=>x.id!==state.selected);state.edges=(state.edges||[]).filter(e=>e.source!==state.selected&&e.target!==state.selected);state.selected=state.nodes[0]?.id;state.flowDirty=true;save();render();toast("Bloco removido. Salve o fluxo para sincronizar.")};if($("#saveFlow"))$("#saveFlow").onclick=async()=>{const b=$("#saveFlow");b.disabled=true;b.textContent="Salvando...";try{await persistFlow();toast("Fluxo salvo no Supabase.");if(state.page==="builder")render()}catch(err){toast("Erro ao salvar: "+(err.message||"tente novamente"));b.disabled=false;b.textContent="Salvar rascunho"}};if($("#publishFlow"))$("#publishFlow").onclick=publishFlow;if($("#testFlow"))$("#testFlow").onclick=openFlowTest;if(state.page==="agenda")bindAgendaActions();if($("#conversationSearch"))$("#conversationSearch").oninput=filterConversationRows;if($("#conversationStatusFilter"))$("#conversationStatusFilter").onchange=filterConversationRows;if($("#conversationChannelFilter"))$("#conversationChannelFilter").onchange=filterConversationRows;if($("#refreshConversations"))$("#refreshConversations").onclick=async()=>{const b=$("#refreshConversations");b.disabled=true;b.textContent="Atualizando...";await loadConversations();};document.querySelectorAll("[data-open-conversation]").forEach(b=>b.onclick=()=>openConversationHistory(b.dataset.openConversation));document.querySelectorAll("[data-delete-conversation]").forEach(b=>b.onclick=async()=>{const id=b.dataset.deleteConversation;const item=state.conversations.find(c=>c.id===id);const name=item?.patient_name||"Paciente não identificado";if(!window.confirm('Excluir permanentemente a conversa de "'+name+'"? O histórico de mensagens também será excluído. Esta ação não pode ser desfeita.'))return;b.disabled=true;const {error}=await odSupabase.from("chatbot_conversations").delete().eq("id",id).eq("professional_id",currentUser.id);if(error){toast("Não foi possível excluir a conversa: "+error.message);b.disabled=false;return}toast("Conversa excluída.");await loadConversations()});if($("#notificationBell"))$("#notificationBell").onclick=()=>go("conversations");if($("#saveProfile"))$("#saveProfile").onclick=saveProfessionalProfile;if($("#saveSettings"))$("#saveSettings").onclick=()=>{["proName","proSpecialty","proAddress"].forEach(id=>localStorage.setItem("od_"+id,$("#"+id).value));toast("Configurações salvas")};if($("#copyWidgetEmbed"))$("#copyWidgetEmbed").onclick=()=>{const field=$("#widgetEmbed");field.select();document.execCommand("copy");toast("Código do chat copiado.");};if($("#whatsInfo"))$("#whatsInfo").onclick=()=>toast("A integração será configurada após provisionar o backend e as credenciais da Meta.");if($("#webInfo"))$("#webInfo").onclick=()=>toast("O widget web será disponibilizado após a implementação do endpoint público.");}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s).replace(/\n/g," ")}

let currentUser=null, authMode="login", authNotice="", authNoticeError=false;
function authScreen(){
 const titles={login:["Acesse seu painel","Entre com o e-mail e a senha da sua conta profissional."],signup:["Crie sua conta","Cadastre-se para começar a organizar seu atendimento no OrientaDor."],recovery:["Recuperar senha","Informe seu e-mail para receber as instruções de redefinição."]};
 const [title,desc]=titles[authMode];
 $("#authRoot").innerHTML='<section class="authscreen"><aside class="authvisual"><div class="authbrand"><div class="authbrandmark">O</div><strong>OrientaDor</strong></div><div class="authcopy"><div class="eyebrow">ÁREA DO PROFISSIONAL</div><h1>Seu atendimento, mais organizado e conectado.</h1><p>Gerencie sua presença profissional e prepare uma experiência de atendimento acolhedora para seus pacientes.</p></div><div class="authfoot">OrientaDor · Plataforma de saúde</div></aside><div class="authformwrap"><div class="authform">'+(authMode!=="login"?'<button class="authback" id="authBack">← Voltar para entrar</button>':'')+'<h2>'+title+'</h2><p class="intro">'+desc+'</p><form id="authForm">'+(authMode==="signup"?'<div class="field"><label>Nome completo</label><input id="authName" autocomplete="name" required placeholder="Seu nome"></div>':'')+'<div class="field"><label>E-mail</label><input id="authEmail" type="email" autocomplete="email" required placeholder="voce@exemplo.com"></div>'+(authMode!=="recovery"?'<div class="field"><label>Senha</label><input id="authPassword" type="password" autocomplete="'+(authMode==="signup"?"new-password":"current-password")+'" minlength="8" required placeholder="Mínimo de 8 caracteres"></div>':'')+(authNotice?'<div class="authmessage '+(authNoticeError?'error':'')+'">'+esc(authNotice)+'</div>':'')+'<button class="btn primary authsubmit" type="submit">'+(authMode==="login"?"Entrar":authMode==="signup"?"Criar conta":"Enviar instruções")+'</button></form>'+(authMode==="login"?'<div class="authswitch"><button id="forgotBtn">Esqueci minha senha</button><br><br>Ainda não tem conta? <button id="signupBtn">Criar cadastro</button></div>':authMode==="signup"?'<div class="authswitch">Já tem uma conta? <button id="loginBtn">Entrar</button></div>':'<div class="authswitch"><button id="loginBtn">Voltar para o login</button></div>')+'<p class="authhint">Se a confirmação de e-mail estiver habilitada no Supabase, será necessário confirmar seu endereço antes do primeiro acesso.</p></div></div></section>';
 $("#authForm").onsubmit=submitAuth;
 if($("#signupBtn"))$("#signupBtn").onclick=()=>{authMode="signup";authNotice="";authScreen()};
 if($("#forgotBtn"))$("#forgotBtn").onclick=()=>{authMode="recovery";authNotice="";authScreen()};
 if($("#loginBtn"))$("#loginBtn").onclick=()=>{authMode="login";authNotice="";authScreen()};
 if($("#authBack"))$("#authBack").onclick=()=>{authMode="login";authNotice="";authScreen()};
}
async function submitAuth(e){
 e.preventDefault();const email=$("#authEmail").value.trim(),password=$("#authPassword")?.value;
 const submit=$("#authForm button[type=submit]");submit.disabled=true;submit.textContent="Aguarde...";
 try{
  if(!odSupabase)throw new Error("Não foi possível inicializar o Supabase. Verifique a configuração do projeto.");
  if(authMode==="login"){
   const {error}=await odSupabase.auth.signInWithPassword({email,password});if(error)throw error;
  }else if(authMode==="signup"){
   const fullName=$("#authName").value.trim();
   const {data,error}=await odSupabase.auth.signUp({email,password,options:{data:{full_name:fullName},emailRedirectTo:window.location.origin+window.location.pathname}});
   if(error)throw error;
   if(!data.session){authNotice="Cadastro recebido! Verifique sua caixa de entrada para confirmar o e-mail e depois faça login.";authNoticeError=false;authMode="login";authScreen();}
  }else{
   const {error}=await odSupabase.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});
   if(error)throw error;authNotice="Se esse e-mail estiver cadastrado, você receberá as instruções para redefinir a senha.";authNoticeError=false;authScreen();
  }
 }catch(err){authNotice=err.message||"Não foi possível concluir. Tente novamente.";authNoticeError=true;authScreen();}
}
function showPanel(user){
 currentUser=user;$("#authRoot").innerHTML="";$(".app").classList.remove("auth-locked");
 if($("#userAvatar"))$("#userAvatar").textContent=(user.user_metadata?.full_name||user.email||"OD").slice(0,2).toUpperCase();
 odSupabase.from("professional_profiles").select("full_name,avatar_url").eq("id",user.id).maybeSingle().then(({data})=>{if(data)updateHeaderAvatar(data.avatar_url,data.full_name||user.user_metadata?.full_name||user.email||"OD")});
 if($("#logoutBtn"))$("#logoutBtn").onclick=async()=>{const {error}=await odSupabase.auth.signOut();if(error)toast("Não foi possível sair: "+error.message)};
 render();
 refreshHeaderNotifications();
 if(!window.odConversationRefreshTimer){window.odConversationRefreshTimer=setInterval(()=>{if(!currentUser)return;refreshHeaderNotifications();if(state.page==="conversations"&&!document.querySelector("#conversationHistoryModal"))loadConversations()},12000)}
}
async function bootAuth(){
 $(".app").classList.add("auth-locked");
 if(!odSupabase){authNotice="Cliente Supabase indisponível. Confira a URL e a publishable key.";authNoticeError=true;authScreen();return;}
 const {data:{session},error}=await odSupabase.auth.getSession();
 if(error){authNotice="Falha ao verificar sessão: "+error.message;authNoticeError=true;authScreen();return;}
 if(session?.user){showPanel(session.user)}else{authMode="login";authScreen()}
 odSupabase.auth.onAuthStateChange((event,session)=>{
  if(session?.user){showPanel(session.user)}
  else if(event==="SIGNED_OUT"||event==="INITIAL_SESSION"){currentUser=null;$(".app").classList.add("auth-locked");authMode="login";authNotice="";authScreen()}
 });
}

bootAuth();
</script></body></html>
