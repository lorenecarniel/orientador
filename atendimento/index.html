<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="brandmark">O</div><div><strong>OrientaDor</strong><small>Atendimento inteligente</small></div></div>
 <div><div class="navlabel">Workspace</div><nav class="nav" id="sidenav">
 <button data-page="overview" class="active"><span class="ico">▦</span>Visão geral</button>
 <button data-page="conversations"><span class="ico">▤</span>Conversas</button>
 <button data-page="templates"><span class="ico">▧</span>Templates</button>
 <button data-page="builder"><span class="ico">⌘</span>Construtor de fluxos</button>
 <button data-page="channels"><span class="ico">◉</span>Canais</button>
 <button data-page="profile"><span class="ico">♙</span>Meu perfil</button>
 <button data-page="settings"><span class="ico">⚙</span>Configurações</button>
 </nav></div>
 <div class="sidebottom"><b>Ambiente de desenvolvimento</b><span>Perfil e fluxos são sincronizados com sua conta. Canais e conversas ainda estão em desenvolvimento.</span></div>
</aside>
<main class="main">
 <header class="topbar"><div class="crumb">OrientaDor <span style="color:#b8c4c8">/</span> <b id="crumb">Visão geral</b></div><div class="topright"><span class="status">● Conta profissional</span><button class="btn" id="logoutBtn">Sair</button><div class="avatar" id="userAvatar">OD</div></div></header>
 <nav class="navdrawer" id="mobileNav">
 <button data-page="overview">Visão geral</button><button data-page="conversations">Conversas</button><button data-page="templates">Templates</button><button data-page="builder">Construtor</button><button data-page="channels">Canais</button><button data-page="profile">Meu perfil</button><button data-page="settings">Configurações</button>
 </nav>
 <section class="content" id="page"></section>
</main></div><div id="authRoot"></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);
// Inicializa o SDK; nenhuma consulta ao banco é feita até aplicarmos o schema e as políticas RLS.
const odSupabase = (window.supabase && window.OD_SUPABASE_CONFIG) ? window.supabase.createClient(window.OD_SUPABASE_CONFIG.url, window.OD_SUPABASE_CONFIG.publishableKey) : null;
window.odSupabase = odSupabase;
const initialNodes=[
{id:"start",type:"start",title:"Início da conversa",text:"Paciente inicia o atendimento pelo site ou WhatsApp."},
{id:"welcome",type:"message",title:"Boas-vindas",text:"Olá! Seja bem-vindo(a)! Sou a assistente virtual de {{nome_profissional}}. Como posso chamar você?"},
{id:"name",type:"question",title:"Identificação do paciente",text:"Perguntar o nome e salvar em {{nome_paciente}}."},
{id:"menu",type:"options",title:"Menu principal",text:"Agendar consulta · Conhecer profissional · Localização · Valores · Falar com atendente"},
{id:"route",type:"condition",title:"Direcionar atendimento",text:"Direciona para o fluxo conforme a opção selecionada."},
{id:"appointment",type:"action",title:"Agendamento",text:"Consultar disponibilidade e registrar solicitação na agenda."},
{id:"human",type:"handoff",title:"Atendimento humano",text:"Encaminhar conversa para a equipe responsável."},
{id:"end",type:"end",title:"Finalização",text:"Concluir atendimento e registrar o resultado."}
];
const templates=[
{id:"health",icon:"✚",name:"Atendimento inicial — Saúde",desc:"Boas-vindas, identificação, menu principal e direcionamento para os principais serviços.",nodes:initialNodes},
{id:"schedule",icon:"▦",name:"Agendamento de consultas",desc:"Coleta de preferência, consulta de horários, dados cadastrais e confirmação.",nodes:[initialNodes[0],{id:"welcome",type:"message",title:"Boas-vindas",text:"Vamos encontrar um horário para você."},{id:"kind",type:"options",title:"Tipo de atendimento",text:"Primeira consulta · Retorno · Acompanhamento"},{id:"period",type:"options",title:"Preferência de horário",text:"Manhã · Tarde · Noite · Flexível"},{id:"calendar",type:"action",title:"Consultar agenda",text:"Consultar disponibilidade real do profissional."},{id:"confirm",type:"question",title:"Confirmar agendamento",text:"Solicitar confirmação do horário selecionado."},initialNodes[7]]},
{id:"faq",icon:"☷",name:"Dúvidas frequentes",desc:"Respostas administrativas sobre serviços, preparo, endereço e formas de pagamento.",nodes:[initialNodes[0],{id:"welcome",type:"message",title:"Apresentação",text:"Olá! Posso ajudar com informações sobre o atendimento."},{id:"faqmenu",type:"options",title:"Escolha uma dúvida",text:"Serviços · Endereço · Pagamento · Preparação para consulta"},{id:"answer",type:"message",title:"Resposta cadastrada",text:"Apresentar conteúdo informativo configurado pelo profissional."},initialNodes[7]]}
];
let state={page:"overview",nodes:JSON.parse(localStorage.getItem("od_nodes")||"null")||structuredClone(initialNodes),selected:"welcome",flowName:localStorage.getItem("od_flowName")||"Atendimento inicial — Saúde",flowId:null,chatbotId:null,flowDirty:false,flowLoading:false,edges:[],previewTemplateId:null,conversations:JSON.parse(localStorage.getItem("od_conversations")||"[]"),channel:JSON.parse(localStorage.getItem("od_channel")||"{}")};
const labels={overview:"Visão geral",conversations:"Conversas",templates:"Templates",builder:"Construtor de fluxos",channels:"Canais",profile:"Meu perfil",settings:"Configurações"};
const types={start:["▶","Início"],message:["▤","Mensagem"],question:["?","Pergunta"],options:["☷","Opções"],condition:["◇","Condição"],action:["⚡","Ação / integração"],handoff:["♧","Atendimento humano"],end:["✓","Finalização"]};
function save(){localStorage.setItem("od_nodes",JSON.stringify(state.nodes));localStorage.setItem("od_flowName",state.flowName);localStorage.setItem("od_conversations",JSON.stringify(state.conversations));localStorage.setItem("od_channel",JSON.stringify(state.channel))}
function toast(t){let el=$("#toast");el.textContent=t;el.classList.remove("hidden");setTimeout(()=>el.classList.add("hidden"),2600)}
function go(p){state.page=p;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));$("#crumb").textContent=labels[p];render();if(p==="profile")loadProfessionalProfile();if(p==="builder"&&!state.flowDirty)loadBuilderFromSupabase()}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
function heading(k,t,d,action=""){return '<div class="heading"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p>'+d+'</p></div>'+action+'</div>'}
function render(){let p=$("#page");if(state.page==="overview")p.innerHTML=overview();if(state.page==="templates")p.innerHTML=templatesPage();if(state.page==="builder")p.innerHTML=builderPage();if(state.page==="conversations")p.innerHTML=conversationsPage();if(state.page==="channels")p.innerHTML=channelsPage();if(state.page==="profile")p.innerHTML=profilePage();if(state.page==="settings")p.innerHTML=settingsPage();bindPage()}
function overview(){return heading("CENTRAL DE ATENDIMENTO","Atendimento inteligente","Acompanhe as conversas e gerencie os fluxos de atendimento dos seus pacientes.",'<button class="btn primary" data-go="builder">＋ Criar fluxo</button>')+
'<div class="cards"><div class="card metric"><span class="label">Conversas iniciadas</span><strong>'+state.conversations.length+'</strong><small>Desde o início da demonstração</small></div><div class="card metric"><span class="label">Fluxos configurados</span><strong>1</strong><small>Template em edição</small></div><div class="card metric"><span class="label">Canais conectados</span><strong>0</strong><small>Configure um canal para ativar</small></div><div class="card metric"><span class="label">Agendamentos</span><strong>0</strong><small>Integração futura com agenda</small></div></div>'+
'<div class="two"><div class="panel"><h3>Seu fluxo principal</h3><p class="sub">Modelo selecionado para o atendimento do paciente.</p><div class="listrow"><div><b>'+esc(state.flowName)+'</b><small>'+state.nodes.length+' blocos · Rascunho do fluxo principal</small></div><span class="pill">Rascunho</span></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn primary" data-go="builder">Editar fluxo</button><button class="btn" data-go="templates">Ver templates</button></div></div><div class="panel"><h3>Próximos passos</h3><p class="sub">Para colocar o atendimento em produção.</p><div class="list"><div class="listrow"><div><b>1. Personalizar o fluxo</b><small>Revise mensagens e opções.</small></div><span class="pill">Pendente</span></div><div class="listrow"><div><b>2. Conectar um canal</b><small>WhatsApp ou chat do site.</small></div><span class="pill gray">Pendente</span></div><div class="listrow"><div><b>3. Configurar integrações</b><small>Agenda e cadastro de pacientes.</small></div><span class="pill gray">Futuro</span></div></div></div></div>'}
function templatesPage(){
 const selected=templates.find(t=>t.id===state.previewTemplateId);
 return heading("BIBLIOTECA","Templates de atendimento","Escolha um modelo, confira as mensagens e personalize o fluxo para a rotina do profissional.")+

}function conditionDefaults(node){
 if(!node||node.type!=="condition")return;
 state.edges=state.edges||[];
 const routes=state.edges.filter(e=>e.source===node.id);
 const yesTarget=state.nodes.find(x=>x.type==="action")||state.nodes.find(x=>x.type==="message")||state.nodes.find(x=>x.id!==node.id);
 const noTarget=state.nodes.find(x=>x.type==="question")||state.nodes.find(x=>x.type==="message"&&x.id!==yesTarget?.id)||state.nodes.find(x=>x.id!==node.id&&x.id!==yesTarget?.id);
 if(!routes[0]&&yesTarget)state.edges.push({source:node.id,target:yesTarget.id,label:"Sim"});
 else if(routes[0]&&!/^(sim|true|yes|verdadeiro)$/i.test(String(routes[0].label||"").trim()))routes[0].label="Sim";
 if(!routes[1]&&noTarget)state.edges.push({source:node.id,target:noTarget.id,label:"Não"});
 else if(routes[1]&&!/^(não|nao|false|no|falso)$/i.test(String(routes[1].label||"").trim())){routes[1].label="Não";if(noTarget)routes[1].target=noTarget.id;}
 if(routes.length>2)state.edges=state.edges.filter(e=>e.source!==node.id||routes.indexOf(e)<2);
}

function openFlowTest(){
 const host=$("#page");if(!host)return;
 const previous=host.querySelector("#flowTestPanel");if(previous){previous.remove();return}
 const panel=document.createElement("section");panel.id="flowTestPanel";panel.className="panel";panel.style.cssText="position:fixed;right:24px;bottom:24px;width:min(420px,calc(100vw - 32px));max-height:75vh;overflow:auto;z-index:30;padding:18px;box-shadow:0 18px 55px #12354b33";
 panel.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><div class="eyebrow">MODO DE TESTE</div><h3 style="margin:5px 0">Simulador do fluxo</h3></div><button class="btn" id="closeFlowTest">Fechar</button></div><p class="sub">Prévia dos blocos e caminhos configurados. Esta simulação não envia mensagens nem executa integrações.</p><div id="flowTestBody"></div>';
 host.appendChild(panel);
 const body=panel.querySelector("#flowTestBody");
 const nodes=state.nodes||[];const edges=state.edges||[];
 const start=nodes.find(n=>n.type==="start")||nodes[0];
 let current=start?.id||null;let variables={};
 function renderVariables(value){return String(value||"").replace(/\{\{\s*([\w.-]+)\s*\}\}/g,(match,key)=>key==="nome_profissional"?(localStorage.getItem("od_proName")||"profissional"):(variables[key]??match));}
 function show(){
  const node=nodes.find(n=>n.id===current);
  if(!node){body.innerHTML='<p>Destino não encontrado. Revise as conexões.</p>';return}
  const outgoing=edges.filter(e=>e.source===node.id);
  body.innerHTML='<div style="background:var(--bg);padding:12px;border-radius:12px;margin:10px 0"><small style="color:var(--muted)">'+esc(types[node.type]?.[1]||"Bloco")+'</small><b style="display:block;margin:4px 0">'+esc(node.title)+'</b><p style="margin:0;white-space:pre-wrap">'+esc(renderVariables(node.text||""))+'</p></div>';
  if(node.type==="question"){const variable=(node.text||"").match(/\{\{\s*([\w.-]+)\s*\}\}/)?.[1]||"resposta";body.innerHTML+='<p class="sub">Resposta de teste · será armazenada em <b>{{'+esc(variable)+'}}</b></p><form id="flowTestAnswer" style="display:flex;gap:8px"><input id="flowTestAnswerValue" required placeholder="Digite sua resposta" style="min-width:0;flex:1;border:1px solid var(--line);border-radius:9px;padding:10px"><button class="btn primary" type="submit">Enviar</button></form>';const answerForm=body.querySelector("#flowTestAnswer");answerForm.onsubmit=(event)=>{event.preventDefault();const value=body.querySelector("#flowTestAnswerValue").value.trim();if(!value)return;variables[variable]=value;const index=nodes.findIndex(n=>n.id===node.id);const next=nodes[index+1];if(next){current=next.id;show()}else{body.insertAdjacentHTML("beforeend",'<p class="sub">Resposta registrada nesta simulação. Variável <b>{{'+esc(variable)+'}}</b> = '+esc(value)+'</p>')}}}
  else if(node.type==="condition"){const rule=node.condition||{};const actual=String(variables[rule.variable]??"").trim();const expected=String(rule.value||"").trim();let passed=false;if(rule.operator==="not_empty")passed=actual.length>0;else if(rule.operator==="empty")passed=actual.length===0;else if(rule.operator==="contains")passed=actual.toLocaleLowerCase().includes(expected.toLocaleLowerCase());else passed=actual.toLocaleLowerCase()===expected.toLocaleLowerCase();const chosen=outgoing.find(e=>(passed?/^(sim|true|yes|verdadeiro)$/i:/^(não|nao|false|no|falso)$/i).test((e.label||"").trim()))||outgoing[passed?0:1];if(chosen){current=chosen.target;show()}else{body.innerHTML+='<p class="sub">Condição avaliada como <b>'+(passed?"Sim":"Não")+'</b>, mas falta configurar a saída correspondente.</p>'}}
  else if(node.type==="end"||node.type==="handoff"){body.innerHTML+='<p class="sub">'+(node.type==="end"?"Fim do fluxo.":"Etapa de atendimento humano.")+'</p><button class="btn primary" id="restartFlowTest">Reiniciar teste</button>'}
  else if(outgoing.length){body.innerHTML+='<p class="sub">Escolha um caminho para continuar:</p><div style="display:grid;gap:8px">'+outgoing.map((e,i)=>'<button class="btn soft" data-test-edge="'+i+'">'+esc(e.label||"Continuar")+' → '+esc(nodes.find(n=>n.id===e.target)?.title||"Destino")+'</button>').join("")+'</div>'}
  else{const index=nodes.findIndex(n=>n.id===node.id);const next=nodes[index+1];body.innerHTML+='<p class="sub">Nenhuma conexão definida para este bloco.</p>'+(next?'<button class="btn primary" id="continueFlowTest">Próximo bloco: '+esc(next.title)+'</button>':'<button class="btn primary" id="restartFlowTest">Reiniciar teste</button>')}
  panel.querySelectorAll("[data-test-edge]").forEach(btn=>btn.onclick=()=>{const edge=outgoing[Number(btn.dataset.testEdge)];current=edge?.target||null;show()});
  const nextBtn=panel.querySelector("#continueFlowTest");if(nextBtn)nextBtn.onclick=()=>{current=nodes[nodes.findIndex(n=>n.id===current)+1]?.id||null;show()};
  const restart=panel.querySelector("#restartFlowTest");if(restart)restart.onclick=()=>{current=start?.id||null;show()};
 }
 panel.querySelector("#closeFlowTest").onclick=()=>panel.remove();
 show();
}

async function loadBuilderFromSupabase(){
 if(!currentUser||!odSupabase||state.flowLoading)return;
 state.flowLoading=true;render();
 try{
  let {data:bot,error:botError}=await odSupabase.from("chatbots").select("id").eq("professional_id",currentUser.id).order("created_at",{ascending:true}).limit(1).maybeSingle();
  if(botError)throw botError;
  if(!bot){
   const {data:created,error}=await odSupabase.from("chatbots").insert({professional_id:currentUser.id,name:"Atendimento principal",description:"Chatbot de atendimento do profissional",channel_mode:"multi",status:"draft"}).select("id").single();
   if(error)throw error;bot=created;
  }
  state.chatbotId=bot.id;
  const {data:flow,error:flowError}=await odSupabase.from("chatbot_flows").select("id,name,definition,status,version").eq("chatbot_id",bot.id).neq("status","archived").order("version",{ascending:false}).limit(1).maybeSingle();
  if(flowError)throw flowError;
  if(flow){
   state.flowId=flow.id;state.flowName=flow.name||"Atendimento principal";
   const def=flow.definition||{};
   if(Array.isArray(def.nodes)&&def.nodes.length){state.nodes=def.nodes;state.edges=Array.isArray(def.edges)?def.edges:[];state.selected=state.nodes.some(x=>x.id===state.selected)?state.selected:(state.nodes[1]?.id||state.nodes[0]?.id)}
   else{state.nodes=structuredClone(initialNodes);state.edges=[];state.selected="welcome"}
  }else{
   state.flowId=null;state.flowName="Atendimento inicial — Saúde";state.nodes=structuredClone(initialNodes);state.edges=[];state.selected="welcome";
  }
  save();
 }catch(err){toast("Não foi possível carregar o fluxo: "+(err.message||"verifique as tabelas e políticas da migration 001."))}
 finally{state.flowLoading=false;render()}
}
async function persistFlow(){
 if(!currentUser||!odSupabase)throw new Error("Sessão profissional indisponível.");
 const name=$("#flowNameInput")?.value.trim()||state.flowName;
 if(!name)throw new Error("Informe um nome para o fluxo.");
 state.flowName=name;
 if(!state.chatbotId){
  const {data:bot,error}=await odSupabase.from("chatbots").insert({professional_id:currentUser.id,name:"Atendimento principal",description:"Chatbot de atendimento do profissional",channel_mode:"multi",status:"draft"}).select("id").single();
  if(error)throw error;state.chatbotId=bot.id;
 }
 const definition={nodes:state.nodes,edges:state.edges||[],settings:{version:2}};
 let result;
 if(state.flowId){
  result=await odSupabase.from("chatbot_flows").update({name,definition,status:"draft"}).eq("id",state.flowId).select("id").single();
 }else{
  result=await odSupabase.from("chatbot_flows").insert({chatbot_id:state.chatbotId,name,definition,status:"draft",version:1}).select("id").single();
 }
 if(result.error)throw result.error;
 state.flowId=result.data.id;state.flowDirty=false;save();
}

function bindPage(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll("[data-preview-template]").forEach(b=>b.onclick=()=>{state.previewTemplateId=b.dataset.previewTemplate;render()});document.querySelectorAll("[data-close-preview]").forEach(b=>b.onclick=()=>{state.previewTemplateId=null;render()});document.querySelectorAll("[data-template]").forEach(b=>b.onclick=()=>{let t=templates.find(x=>x.id===b.dataset.template);if(!t)return;state.nodes=structuredClone(t.nodes).map((n,i)=>({...n,id:n.id+"_"+Date.now()+"_"+i}));state.edges=[];state.flowName=t.name;state.selected=state.nodes[1]?.id||state.nodes[0].id;state.previewTemplateId=null;state.flowDirty=true;save();go("builder");toast("Modelo carregado. Personalize e salve no Supabase.")});document.querySelectorAll("[data-node]").forEach(b=>b.onclick=()=>{state.selected=b.dataset.node;render()});document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{let type=b.dataset.add;let id=type+"_"+Date.now();state.nodes.push({id,type,title:types[type][1],text:"Configure o conteúdo deste bloco."});if(type==="condition"){const yes=state.nodes.find(x=>x.type==="action"&&x.id!==id)||state.nodes.find(x=>x.type==="message"&&x.id!==id);const no=state.nodes.find(x=>x.type==="question"&&x.id!==id)||state.nodes.find(x=>x.type==="message"&&x.id!==id&&x.id!==yes?.id);state.edges=state.edges||[];if(yes)state.edges.push({source:id,target:yes.id,label:"Sim"});if(no)state.edges.push({source:id,target:no.id,label:"Não"});}state.selected=id;state.flowDirty=true;save();render()});document.querySelectorAll("[data-route-label]").forEach(el=>el.oninput=()=>{const e=(state.edges||[]).filter(x=>x.source===state.selected)[Number(el.dataset.routeLabel)];if(e){e.label=el.value;state.flowDirty=true}});document.querySelectorAll("[data-route-target]").forEach(el=>el.onchange=()=>{const e=(state.edges||[]).filter(x=>x.source===state.selected)[Number(el.dataset.routeTarget)];if(e){e.target=el.value;state.flowDirty=true;render()}});document.querySelectorAll("[data-remove-route]").forEach(el=>el.onclick=()=>{const list=(state.edges||[]).filter(x=>x.source===state.selected);const remove=list[Number(el.dataset.removeRoute)];state.edges=state.edges.filter(x=>x!==remove);state.flowDirty=true;render()});if($("#addRoute"))$("#addRoute").onclick=()=>{const source=state.nodes.find(x=>x.id===state.selected);const target=state.nodes.find(x=>x.id!==source.id);if(!target){toast("Adicione outro bloco antes de criar um caminho.");return}state.edges=state.edges||[];state.edges.push({source:source.id,target:target.id,label:"Nova opção"});state.flowDirty=true;render()};if($("#applyNode"))$("#applyNode").onclick=()=>{let n=state.nodes.find(x=>x.id===state.selected);n.title=$("#nodeTitle").value;n.text=$("#nodeText").value;if(n.type==="condition"){n.condition={variable:$("#conditionVariable")?.value.trim()||"resposta",operator:$("#conditionOperator")?.value||"equals",value:$("#conditionValue")?.value.trim()||""};}state.flowDirty=true;save();render();toast("Bloco atualizado. Salve o fluxo para sincronizar.")};if($("#deleteNode"))$("#deleteNode").onclick=()=>{state.nodes=state.nodes.filter(x=>x.id!==state.selected);state.edges=(state.edges||[]).filter(e=>e.source!==state.selected&&e.target!==state.selected);state.selected=state.nodes[0]?.id;state.flowDirty=true;save();render();toast("Bloco removido. Salve o fluxo para sincronizar.")};if($("#saveFlow"))$("#saveFlow").onclick=async()=>{const b=$("#saveFlow");b.disabled=true;b.textContent="Salvando...";try{await persistFlow();toast("Fluxo salvo no Supabase.");if(state.page==="builder")render()}catch(err){toast("Erro ao salvar: "+(err.message||"tente novamente"));b.disabled=false;b.textContent="Salvar rascunho"}};if($("#testFlow"))$("#testFlow").onclick=openFlowTest;if($("#saveProfile"))$("#saveProfile").onclick=saveProfessionalProfile;if($("#saveSettings"))$("#saveSettings").onclick=()=>{["proName","proSpecialty","proAddress"].forEach(id=>localStorage.setItem("od_"+id,$("#"+id).value));toast("Configurações salvas")};if($("#whatsInfo"))$("#whatsInfo").onclick=()=>toast("A integração será configurada após provisionar o backend e as credenciais da Meta.");if($("#webInfo"))$("#webInfo").onclick=()=>toast("O widget web será disponibilizado após a implementação do endpoint público.");}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function attr(s){return esc(s).replace(/\n/g," ")}

let currentUser=null, authMode="login", authNotice="", authNoticeError=false;
function authScreen(){
 const titles={login:["Acesse seu painel","Entre com o e-mail e a senha da sua conta profissional."],signup:["Crie sua conta","Cadastre-se para começar a organizar seu atendimento no OrientaDor."],recovery:["Recuperar senha","Informe seu e-mail para receber as instruções de redefinição."]};
 const [title,desc]=titles[authMode];
 $("#authRoot").innerHTML='<section class="authscreen"><aside class="authvisual"><div class="authbrand"><div class="authbrandmark">O</div><strong>OrientaDor</strong></div><div class="authcopy"><div class="eyebrow">ÁREA DO PROFISSIONAL</div><h1>Seu atendimento, mais organizado e conectado.</h1><p>Gerencie sua presença profissional e prepare uma experiência de atendimento acolhedora para seus pacientes.</p></div><div class="authfoot">OrientaDor · Plataforma de saúde</div></aside><div class="authformwrap"><div class="authform">'+(authMode!=="login"?'<button class="authback" id="authBack">← Voltar para entrar</button>':'')+'<h2>'+title+'</h2><p class="intro">'+desc+'</p><form id="authForm">'+(authMode==="signup"?'<div class="field"><label>Nome completo</label><input id="authName" autocomplete="name" required placeholder="Seu nome"></div>':'')+'<div class="field"><label>E-mail</label><input id="authEmail" type="email" autocomplete="email" required placeholder="voce@exemplo.com"></div>'+(authMode!=="recovery"?'<div class="field"><label>Senha</label><input id="authPassword" type="password" autocomplete="'+(authMode==="signup"?"new-password":"current-password")+'" minlength="8" required placeholder="Mínimo de 8 caracteres"></div>':'')+(authNotice?'<div class="authmessage '+(authNoticeError?'error':'')+'">'+esc(authNotice)+'</div>':'')+'<button class="btn primary authsubmit" type="submit">'+(authMode==="login"?"Entrar":authMode==="signup"?"Criar conta":"Enviar instruções")+'</button></form>'+(authMode==="login"?'<div class="authswitch"><button id="forgotBtn">Esqueci minha senha</button><br><br>Ainda não tem conta? <button id="signupBtn">Criar cadastro</button></div>':authMode==="signup"?'<div class="authswitch">Já tem uma conta? <button id="loginBtn">Entrar</button></div>':'<div class="authswitch"><button id="loginBtn">Voltar para o login</button></div>')+'<p class="authhint">Se a confirmação de e-mail estiver habilitada no Supabase, será necessário confirmar seu endereço antes do primeiro acesso.</p></div></div></section>';
 $("#authForm").onsubmit=submitAuth;
 if($("#signupBtn"))$("#signupBtn").onclick=()=>{authMode="signup";authNotice="";authScreen()};
 if($("#forgotBtn"))$("#forgotBtn").onclick=()=>{authMode="recovery";authNotice="";authScreen()};
 if($("#loginBtn"))$("#loginBtn").onclick=()=>{authMode="login";authNotice="";authScreen()};
 if($("#authBack"))$("#authBack").onclick=()=>{authMode="login";authNotice="";authScreen()};
}
async function submitAuth(e){
 e.preventDefault();const email=$("#authEmail").value.trim(),password=$("#authPassword")?.value;
 const submit=$("#authForm button[type=submit]");submit.disabled=true;submit.textContent="Aguarde...";
 try{
  if(!odSupabase)throw new Error("Não foi possível inicializar o Supabase. Verifique a configuração do projeto.");
  if(authMode==="login"){
   const {error}=await odSupabase.auth.signInWithPassword({email,password});if(error)throw error;
  }else if(authMode==="signup"){
   const fullName=$("#authName").value.trim();
   const {data,error}=await odSupabase.auth.signUp({email,password,options:{data:{full_name:fullName},emailRedirectTo:window.location.origin+window.location.pathname}});
   if(error)throw error;
   if(!data.session){authNotice="Cadastro recebido! Verifique sua caixa de entrada para confirmar o e-mail e depois faça login.";authNoticeError=false;authMode="login";authScreen();}
  }else{
   const {error}=await odSupabase.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});
   if(error)throw error;authNotice="Se esse e-mail estiver cadastrado, você receberá as instruções para redefinir a senha.";authNoticeError=false;authScreen();
  }
 }catch(err){authNotice=err.message||"Não foi possível concluir. Tente novamente.";authNoticeError=true;authScreen();}
}
function showPanel(user){
 currentUser=user;$("#authRoot").innerHTML="";$(".app").classList.remove("auth-locked");
 if($("#userAvatar"))$("#userAvatar").textContent=(user.user_metadata?.full_name||user.email||"OD").slice(0,2).toUpperCase();
 if($("#logoutBtn"))$("#logoutBtn").onclick=async()=>{const {error}=await odSupabase.auth.signOut();if(error)toast("Não foi possível sair: "+error.message)};
 render();
}
async function bootAuth(){
 $(".app").classList.add("auth-locked");
 if(!odSupabase){authNotice="Cliente Supabase indisponível. Confira a URL e a publishable key.";authNoticeError=true;authScreen();return;}
 const {data:{session},error}=await odSupabase.auth.getSession();
 if(error){authNotice="Falha ao verificar sessão: "+error.message;authNoticeError=true;authScreen();return;}
 if(session?.user){showPanel(session.user)}else{authMode="login";authScreen()}
 odSupabase.auth.onAuthStateChange((event,session)=>{
  if(session?.user){showPanel(session.user)}
  else if(event==="SIGNED_OUT"||event==="INITIAL_SESSION"){currentUser=null;$(".app").classList.add("auth-locked");authMode="login";authNotice="";authScreen()}
 });
}

bootAuth();
</script></body></html>
