.agenda-config-gutter{border-right:1px solid var(--line)}
.agenda-config-hour-body{display:grid;grid-template-columns:58px repeat(7,minmax(88px,1fr))}
.agenda-config-hour-axis{display:grid;grid-template-rows:repeat(14,42px)}

}function conditionDefaults(node){
 if(!node||node.type!=="condition")return;
 state.edges=state.edges||[];
 let routes=state.edges.filter(e=>e.source===node.id);
 const yesTarget=state.nodes.find(x=>x.type==="action"&&x.id!==node.id)||state.nodes.find(x=>x.type==="message"&&x.id!==node.id)||state.nodes.find(x=>x.id!==node.id);
 let noTarget=state.nodes.find(x=>x.type==="question"&&x.id!==node.id&&x.id!==yesTarget?.id)||state.nodes.find(x=>x.type==="message"&&x.id!==node.id&&x.id!==yesTarget?.id)||state.nodes.find(x=>x.id!==node.id&&x.id!==yesTarget?.id);
 if(!routes[0]&&yesTarget){state.edges.push({source:node.id,target:yesTarget.id,label:"Sim"});}
 if(!routes[1]&&noTarget){state.edges.push({source:node.id,target:noTarget.id,label:"Não"});}
 routes=state.edges.filter(e=>e.source===node.id);
 if(routes[0]){routes[0].label="Sim";if(!state.nodes.some(x=>x.id===routes[0].target)&&yesTarget)routes[0].target=yesTarget.id;}
 if(routes[1]){routes[1].label="Não";if(!state.nodes.some(x=>x.id===routes[1].target)&&noTarget)routes[1].target=noTarget.id;}
 if(routes.length>2)state.edges=state.edges.filter(e=>e.source!==node.id||routes.indexOf(e)<2);
}

async function publishFlow(){
 const button=$("#publishFlow");if(button){button.disabled=true;button.textContent="Validando...";}
 try{
  if(!currentUser||!odSupabase)throw new Error("Faça login para publicar.");
  const name=$("#flowNameInput")?.value.trim()||state.flowName;
  if(!name)throw new Error("Informe um nome para o fluxo.");
  if(!state.nodes.length)throw new Error("Adicione blocos antes de publicar.");
  const ids=new Set(state.nodes.map(n=>n.id));
  const invalid=(state.edges||[]).find(e=>!ids.has(e.source)||!ids.has(e.target)||e.source===e.target||!String(e.label||"").trim());
  if(invalid)throw new Error("Há uma conexão inválida ou sem nome. Revise os caminhos.");
  for(const node of state.nodes.filter(n=>n.type==="options")){const outgoing=(state.edges||[]).filter(e=>e.source===node.id);if(!outgoing.length)throw new Error("O bloco de opções "+node.title+" precisa ter pelo menos um caminho configurado.");if(outgoing.some(e=>!String(e.label||"").trim()))throw new Error("Todas as opções precisam ter um texto.");}
  for(const node of state.nodes.filter(n=>n.type==="condition")){
   const outgoing=(state.edges||[]).filter(e=>e.source===node.id);
   const yes=outgoing.some(e=>/^(sim|true|yes|verdadeiro)$/i.test(String(e.label||"").trim()));
   const no=outgoing.some(e=>/^(não|nao|false|no|falso)$/i.test(String(e.label||"").trim()));
   if(!node.condition?.variable||!yes||!no)throw new Error("A condição "+node.title+" precisa de uma variável e saídas Sim e Não.");
  }
  if(!state.nodes.some(n=>n.type==="start"))throw new Error("O fluxo precisa ter um bloco de início.");
  await persistFlow();
  const latest=await odSupabase.from("chatbot_flows").select("version").eq("chatbot_id",state.chatbotId).order("version",{ascending:false}).limit(1).maybeSingle();
  if(latest.error)throw latest.error;
  const version=(latest.data?.version||0)+1;
  const definition={nodes:structuredClone(state.nodes),edges:structuredClone(state.edges||[]),settings:{version:2,published_from:state.flowId}};
  const published=await odSupabase.from("chatbot_flows").insert({chatbot_id:state.chatbotId,name,definition,status:"published",version,published_at:new Date().toISOString()}).select("id").single();
  if(published.error)throw published.error;
  const botUpdate=await odSupabase.from("chatbots").update({name,status:"published",updated_at:new Date().toISOString()}).eq("id",state.chatbotId);
  if(botUpdate.error)throw botUpdate.error;
  toast("Versão "+version+" publicada! Seu rascunho continua disponível para edição.");
 }catch(err){toast("Não foi possível publicar: "+(err.message||"erro inesperado"));}
 finally{if(button){button.disabled=false;button.textContent="Publicar fluxo";}}
}

async function refreshHeaderNotifications(){

 if(error){console.warn("Não foi possível atualizar notificações:",error.message);return}
 const ids=(items||[]).map(x=>x.id);
 let hasUnread=false;
 if(ids.length){
  const {data:messages,error:msgError}=await odSupabase.from("chatbot_messages").select("conversation_id,sender_type,direction,created_at").in("conversation_id",ids).order("created_at",{ascending:false});
  if(msgError){console.warn("Não foi possível consultar notificações:",msgError.message);return}
  const latest={};
  (messages||[]).forEach(m=>{if(!latest[m.conversation_id])latest[m.conversation_id]=m});
  hasUnread=Object.values(latest).some(m=>m.sender_type==="patient"||m.direction==="inbound");
 }
 const dot=$("#notificationBellDot");if(dot)dot.hidden=!hasUnread;
 const bell=$("#notificationBell");if(bell){bell.setAttribute("aria-label",hasUnread?"Você tem mensagens novas":"Nenhuma mensagem nova");bell.title=hasUnread?"Você tem mensagens novas. Clique para abrir as conversas.":"Notificações";}

let conversationsLoading=false;
async function loadConversations(){
 if(!currentUser||!odSupabase||conversationsLoading)return;
 conversationsLoading=true;
 const preservedFilters={search:$("#conversationSearch")?.value||"",status:$("#conversationStatusFilter")?.value||"",channel:$("#conversationChannelFilter")?.value||""};
 const result=await odSupabase.from("chatbot_conversations").select("id,patient_name,channel,status,is_test,last_message_at,started_at,flow_id,assigned_to,assigned_at,handoff_channel").eq("professional_id",currentUser.id).order("last_message_at",{ascending:false}).limit(100);
 if(result.error){conversationsLoading=false;toast("Não foi possível carregar conversas: "+result.error.message);return}
 state.conversations=result.data||[];
 const liveIds=state.conversations.filter(c=>!c.is_test&&c.status!=="closed").map(c=>c.id);
 if(liveIds.length){
  const msgResult=await odSupabase.from("chatbot_messages").select("conversation_id,sender_type,direction,created_at").in("conversation_id",liveIds).order("created_at",{ascending:true});
  if(msgResult.error){console.warn("Não foi possível calcular mensagens pendentes:",msgResult.error.message);}
  else{
   const latestByConversation={};
   (msgResult.data||[]).forEach(m=>{latestByConversation[m.conversation_id]=m});
   state.conversations=state.conversations.map(c=>{
    const latest=latestByConversation[c.id];
    const unread=latest&&(latest.sender_type==="patient"||latest.direction==="inbound")?1:0;
    return {...c,unread_count:unread};
   });
  }
 }
 render();
 if($("#conversationSearch"))$("#conversationSearch").value=preservedFilters.search;
 if($("#conversationStatusFilter"))$("#conversationStatusFilter").value=preservedFilters.status;
 if($("#conversationChannelFilter"))$("#conversationChannelFilter").value=preservedFilters.channel;
 filterConversationRows();
 conversationsLoading=false;
}

 if(first.error){toast("Erro ao abrir conversa: "+first.error.message);return}

async function loadBuilderFromSupabase(){
 if(!currentUser||!odSupabase||state.flowLoading)return;

 try{
  let {data:bot,error:botError}=await odSupabase.from("chatbots").select("id").eq("professional_id",currentUser.id).order("created_at",{ascending:true}).limit(1).maybeSingle();
  if(botError)throw botError;
  if(!bot){
   const {data:created,error}=await odSupabase.from("chatbots").insert({professional_id:currentUser.id,name:"Atendimento principal",description:"Chatbot de atendimento do profissional",channel_mode:"multi",status:"draft"}).select("id").single();
   if(error)throw error;bot=created;
  }
  state.chatbotId=bot.id;
  let {data:flow,error:flowError}=await odSupabase.from("chatbot_flows").select("id,name,definition,status,version").eq("chatbot_id",bot.id).eq("status","draft").order("version",{ascending:false}).limit(1).maybeSingle();
  if(flowError)throw flowError;
  if(!flow){const published=await odSupabase.from("chatbot_flows").select("id,name,definition,status,version").eq("chatbot_id",bot.id).eq("status","published").order("version",{ascending:false}).limit(1).maybeSingle();if(published.error)throw published.error;flow=published.data;}
  if(flow){
   state.flowId=flow.id;state.flowName=flow.name||"Atendimento principal";
   const def=flow.definition||{};
   if(Array.isArray(def.nodes)&&def.nodes.length){state.nodes=def.nodes;state.edges=Array.isArray(def.edges)?def.edges:[];state.selected=state.nodes.some(x=>x.id===state.selected)?state.selected:(state.nodes[1]?.id||state.nodes[0]?.id)}
   else{state.nodes=structuredClone(initialNodes);state.edges=structuredClone(initialEdges);state.selected="welcome"}
  }else{
   state.flowId=null;state.flowName="Atendimento inicial — Saúde";state.nodes=structuredClone(initialNodes);state.edges=structuredClone(initialEdges);state.selected="welcome";
  }
  save();
 }catch(err){toast("Não foi possível carregar o fluxo: "+(err.message||"verifique as tabelas e políticas da migration 001."))}
 finally{state.flowLoading=false;render()}
}

function renderAgendaConfigWeek(availability=[],blocks=[]){
 const root=$("#agendaConfigWeek");if(!root)return;
 const names=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
 const selected=new Date(($("#agendaDate")?.value||localDateKey(new Date()))+"T12:00:00");
 const first=startOfWeek(selected);
 const days=Array.from({length:7},(_,i)=>{const d=new Date(first);d.setDate(d.getDate()+i);return d});
 const startOfDay=7*60,minutesPerHour=60,rowHeight=42,totalHeight=14*rowHeight;
 const mins=value=>{const p=String(value||"00:00").split(":");return Number(p[0])*60+Number(p[1]||0)};
 const clock=value=>new Date(value).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
 const card=(kind,top,height,label,title)=>'<div class="agenda-config-hour-slot '+kind+'" style="top:'+top+'px;height:'+Math.max(18,height)+'px" title="'+esc(title)+'">'+esc(label)+'</div>';
 const head='<div class="agenda-config-hour-head"><div class="agenda-config-gutter"></div>'+days.map((d,i)=>'<div class="agenda-config-hour-day"><small>'+names[i]+'</small><b>'+d.getDate()+'</b></div>').join("")+'</div>';
 const body='<div class="agenda-config-hour-body"><div class="agenda-config-hour-axis">'+Array.from({length:14},(_,i)=>'<div class="agenda-config-hour-label">'+String(i+7).padStart(2,"0")+':00</div>').join("")+'</div>'+
 days.map(d=>{
  const day=d.getDay(),key=localDateKey(d);
  const dayBlocks=blocks.filter(b=>localDateKey(new Date(b.starts_at))===key).map(b=>({start:new Date(b.starts_at).getHours()*60+new Date(b.starts_at).getMinutes(),end:new Date(b.ends_at).getHours()*60+new Date(b.ends_at).getMinutes(),reason:b.reason||"Bloqueio"})).filter(b=>b.end>b.start);
  const ranges=availability.filter(a=>Number(a.weekday)===day).map(a=>({start:mins(a.start_time),end:mins(a.end_time)})).filter(x=>x.end>x.start);
  const cards=[];
  ranges.forEach(range=>{
   let pieces=[range];
   dayBlocks.forEach(block=>{
    pieces=pieces.flatMap(piece=>{
     if(block.end<=piece.start||block.start>=piece.end)return [piece];
     const result=[];
     if(block.start>piece.start)result.push({start:piece.start,end:block.start});
     if(block.end<piece.end)result.push({start:block.end,end:piece.end});
     return result;
    });
   });
   pieces.forEach(piece=>{
    const start=Math.max(piece.start,startOfDay),end=Math.min(piece.end,startOfDay+totalHeight/rowHeight*60);
    if(end<=start)return;
    const top=(start-startOfDay)/60*rowHeight,height=(end-start)/60*rowHeight;
    const label=(String(Math.floor(start/60)).padStart(2,"0")+":"+String(start%60).padStart(2,"0"))+"–"+(String(Math.floor(end/60)).padStart(2,"0")+":"+String(end%60).padStart(2,"0"))+" · Atendimento";
    cards.push(card("available",top,height,label,label));
   });
  });
  dayBlocks.forEach(block=>{
   const start=Math.max(block.start,startOfDay),end=Math.min(block.end,startOfDay+14*60);
   if(end<=start)return;
   const top=(start-startOfDay)/60*rowHeight,height=(end-start)/60*rowHeight;
   const label=String(Math.floor(start/60)).padStart(2,"0")+":"+String(start%60).padStart(2,"0")+"–"+String(Math.floor(end/60)).padStart(2,"0")+":"+String(end%60).padStart(2,"0")+" · "+block.reason;
   cards.push(card("blocked",top,height,label,label));
  });
  return '<div class="agenda-config-hour-day-column">'+cards.join("")+'</div>';
 }).join("")+'</div>';
 root.innerHTML='<div class="agenda-config-hour-grid">'+head+body+'</div>';
}

async function rescheduleAgendaAppointment(appointment){

  const date=new Date(r.consultation_date),files=attachmentsByRecord[r.id]||[];

let currentUser=null, authMode="login", authNotice="", authNoticeError=false;

 const titles={login:["Acesse seu painel","Entre com o e-mail e a senha da sua conta profissional."],signup:["Crie sua conta","Cadastre-se para começar a organizar seu atendimento no OrientaDor."],recovery:["Recuperar senha","Informe seu e-mail para receber as instruções de redefinição."]};

 $("#authForm").onsubmit=submitAuth;
 if($("#signupBtn"))$("#signupBtn").onclick=()=>{authMode="signup";authNotice="";authScreen()};

 if($("#authBack"))$("#authBack").onclick=()=>{authMode="login";authNotice="";authScreen()};

async function submitAuth(e){
 e.preventDefault();const email=$("#authEmail").value.trim(),password=$("#authPassword")?.value;
 const submit=$("#authForm button[type=submit]");submit.disabled=true;submit.textContent="Aguarde...";
 try{
  if(!odSupabase)throw new Error("Não foi possível inicializar o Supabase. Verifique a configuração do projeto.");
  if(authMode==="login"){
   const {error}=await odSupabase.auth.signInWithPassword({email,password});if(error)throw error;
  }else if(authMode==="signup"){
   const fullName=$("#authName").value.trim();
   const {data,error}=await odSupabase.auth.signUp({email,password,options:{data:{full_name:fullName},emailRedirectTo:window.location.origin+window.location.pathname}});
   if(error)throw error;
   if(!data.session){authNotice="Cadastro recebido! Verifique sua caixa de entrada para confirmar o e-mail e depois faça login.";authNoticeError=false;authMode="login";authScreen();}
  }else{
   const {error}=await odSupabase.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});
   if(error)throw error;authNotice="Se esse e-mail estiver cadastrado, você receberá as instruções para redefinir a senha.";authNoticeError=false;authScreen();
  }
 }catch(err){authNotice=err.message||"Não foi possível concluir. Tente novamente.";authNoticeError=true;authScreen();}
}

 if(!window.odConversationRefreshTimer){window.odConversationRefreshTimer=setInterval(()=>{if(!currentUser)return;refreshHeaderNotifications();if(state.page==="conversations"&&!document.querySelector("#conversationHistoryModal"))loadConversations()},12000)}
}
async function bootAuth(){
 $(".app").classList.add("auth-locked");
 if(!odSupabase){authNotice="Cliente Supabase indisponível. Confira a URL e a publishable key.";authNoticeError=true;authScreen();return;}
 const {data:{session},error}=await odSupabase.auth.getSession();
 if(error){authNotice="Falha ao verificar sessão: "+error.message;authNoticeError=true;authScreen();return;}
 if(session?.user){showPanel(session.user)}else{authMode="login";authScreen()}
 odSupabase.auth.onAuthStateChange((event,session)=>{
  if(session?.user){showPanel(session.user)}
  else if(event==="SIGNED_OUT"||event==="INITIAL_SESSION"){currentUser=null;$(".app").classList.add("auth-locked");authMode="login";authNotice="";authScreen()}
 });
}

bootAuth();
</script></body></html>
